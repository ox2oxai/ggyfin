apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ggy-ingress
  namespace: ggy-finance
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - ggyfinance.in
        - api.ggyfinance.in
      secretName: ggy-tls-certs
  rules:
    - host: ggyfinance.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ggy-web-service
                port:
                  number: 3000
    - host: api.ggyfinance.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ggy-api-service
                port:
                  number: 4000
