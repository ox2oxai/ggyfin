  S3_BUCKET_NAME: "ggy-finance-kyc-vault"
  TRAI_DLT_HEADER: "GGYFIN"
  TZ: "Asia/Kolkata"
  NEXT_PUBLIC_API_URL: "https://api.ggyfinance.in"
