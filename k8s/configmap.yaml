apiVersion: v1
kind: ConfigMap
metadata:
  name: ggy-config
  namespace: ggy-finance
data:
  NODE_ENV: "production"
  PORT: "4000"
  HOST: "0.0.0.0"
  UPI_MERCHANT_VPA: "ggycollect@icici"
  UPI_PAYEE_NAME: "GGY Finance"
  STORAGE_DRIVER: "s3"
